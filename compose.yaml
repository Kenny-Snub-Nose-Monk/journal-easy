services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: journal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: journal_easy
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - journal-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U journal -d journal_easy']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  journal-db:
