name: Deploy to GCP
on:
  push:
    branches:
      - test-deploy

env:
  # GCP Configuration
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-east1
  ARTIFACT_REGISTRY: ${{ secrets.GCP_ARTIFACT_REGISTRY }}

  # Email Configuration
  EMAIL_SERVER_HOST: ${{ secrets.EMAIL_SERVER_HOST }}
  EMAIL_SERVER_PORT: ${{ secrets.EMAIL_SERVER_PORT }}
  EMAIL_SERVER_USER: ${{ secrets.EMAIL_SERVER_USER }}
  EMAIL_SERVER_PASSWORD: ${{ secrets.EMAIL_SERVER_PASSWORD }}
  EMAIL_SERVER_FROM: ${{ secrets.EMAIL_SERVER_FROM }}

  # Application Configuration
  GOOGLE_CLOUD_BUCKET_NAME: ${{ secrets.GOOGLE_CLOUD_BUCKET_NAME }}
  TIPTAP_PRO_TOKEN: ${{ secrets.TIPTAP_PRO_TOKEN }}
  NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
  NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}

  # OAuth Configuration (Production)
  GITHUB_ID: ${{ secrets.PROD_GITHUB_ID }}
  GITHUB_SECRET: ${{ secrets.PROD_GITHUB_SECRET }}

  # Collaborative Edit
  COLLABORATIVE_EDIT_URL: ${{ secrets.NEXT_PUBLIC_COLLABORATE_EDIT_URL }}

  # Image Processor
  IMAGE_PROCESSOR_URL: ${{ secrets.NEXT_PUBLIC_IMAGE_PROCESSOR_URL }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # 在設置 Cloud SDK 之前清除緩存
      - name: Clear cache
        run: |
          rm -rf ./.next/cache
          echo "Cache cleared"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ env.PROJECT_ID }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          export_default_credentials: true

      - name: Configure Docker for Artifact Registry
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' > gcp-sa-key.json
          gcloud auth activate-service-account github-actions@${{ env.PROJECT_ID }}.iam.gserviceaccount.com --key-file=gcp-sa-key.json
          gcloud auth configure-docker asia-east1-docker.pkg.dev
          rm gcp-sa-key.json

      - name: Build and Push Docker image
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          # Debug: Check if token exists (will print length only for security)
          echo "TIPTAP_PRO_TOKEN length: ${#TIPTAP_PRO_TOKEN}"

          # Create temporary .npmrc file
          echo "@tiptap-pro:registry=https://registry.tiptap.dev/" > .npmrc
          echo "//registry.tiptap.dev/:_authToken=${{ env.TIPTAP_PRO_TOKEN }}" >> .npmrc

          # Create service account key file
          echo "$GCP_SA_KEY" > /tmp/gcp-sa-key.json

          # Build Docker image
          docker build \
          --build-arg TIPTAP_PRO_TOKEN=${{ env.TIPTAP_PRO_TOKEN }} \
          --build-arg GOOGLE_CLOUD_BUCKET_NAME=${{ env.GOOGLE_CLOUD_BUCKET_NAME }} \
          --progress=plain \
          -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY }}/huashui-ai:${{ github.sha }} \
          .
            
          # Cleanup
          rm /tmp/gcp-sa-key.json
          rm .npmrc

          # Push image
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY }}/huashui-ai:${{ github.sha }}

      - name: Check Environment Variables
        run: |
          echo "Checking COLLABORATIVE_EDIT_URL..."
          echo "Value: ${{ env.COLLABORATIVE_EDIT_URL }}"
          if [ -z "${{ env.COLLABORATIVE_EDIT_URL }}" ]; then
            echo "Warning: COLLABORATIVE_EDIT_URL is empty!"
          fi

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy huashui-ai \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY }}/huashui-ai:${{ github.sha }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --port 8080 \
            --allow-unauthenticated \
            --revision-suffix=$(date +%Y%m%d-%H%M%S) \
            --set-env-vars="NEXTAUTH_URL=${{ env.NEXTAUTH_URL }}" \
            --set-env-vars="NEXTAUTH_SECRET=${{ env.NEXTAUTH_SECRET }}" \
            --set-env-vars="GITHUB_ID=${{ env.GITHUB_ID }}" \
            --set-env-vars="GITHUB_SECRET=${{ env.GITHUB_SECRET }}" \
            --set-env-vars="EMAIL_SERVER_HOST=${{ env.EMAIL_SERVER_HOST }}" \
            --set-env-vars="EMAIL_SERVER_PORT=${{ env.EMAIL_SERVER_PORT }}" \
            --set-env-vars="EMAIL_SERVER_USER=${{ env.EMAIL_SERVER_USER }}" \
            --set-env-vars="EMAIL_SERVER_PASSWORD=${{ env.EMAIL_SERVER_PASSWORD }}" \
            --set-env-vars="EMAIL_SERVER_FROM=${{ env.EMAIL_SERVER_FROM }}" \
            --set-env-vars="GOOGLE_CLOUD_BUCKET_NAME=${{ env.GOOGLE_CLOUD_BUCKET_NAME }}" \
            --set-env-vars="TIPTAP_PRO_TOKEN=${{ env.TIPTAP_PRO_TOKEN }}" \
            --set-env-vars="GOOGLE_CLOUD_PROJECT_ID=${{ env.PROJECT_ID }}" \
            --set-env-vars="NEXT_PUBLIC_COLLABORATE_EDIT_URL=${{ env.COLLABORATIVE_EDIT_URL }}" \
            --set-env-vars="NEXT_PUBLIC_IMAGE_PROCESSOR_URL=${{ env.IMAGE_PROCESSOR_URL }}" \
            --update-secrets="DATABASE_URL=DATABASE_URL:latest" \

          echo "Service URL: $(gcloud run services describe huashui-ai --region ${{ env.REGION }} --format 'value(status.url)')"
