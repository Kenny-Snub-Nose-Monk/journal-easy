name: Deploy to GCP
on:
  push:
    branches:
      - test-deploy

env:
  # GCP Configuration
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-east1
  ARTIFACT_REGISTRY: ${{ secrets.GCP_ARTIFACT_REGISTRY }}

  # Email Configuration
  EMAIL_SERVER_HOST: ${{ secrets.EMAIL_SERVER_HOST }}
  EMAIL_SERVER_PORT: ${{ secrets.EMAIL_SERVER_PORT }}
  EMAIL_SERVER_USER: ${{ secrets.EMAIL_SERVER_USER }}
  EMAIL_SERVER_PASSWORD: ${{ secrets.EMAIL_SERVER_PASSWORD }}
  EMAIL_FROM: ${{ secrets.EMAIL_FROM }}

  # Application Configuration
  GOOGLE_CLOUD_BUCKET_NAME: ${{ secrets.GOOGLE_CLOUD_BUCKET_NAME }}
  TIPTAP_PRO_TOKEN: ${{ secrets.TIPTAP_PRO_TOKEN }}
  NEXTAUTH_URL: https://huashui-ai-abeco3wo7a-de.a.run.app
  NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}

  # OAuth Configuration (Production)
  GITHUB_ID: ${{ secrets.PROD_GITHUB_ID }}
  GITHUB_SECRET: ${{ secrets.PROD_GITHUB_SECRET }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ env.PROJECT_ID }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          export_default_credentials: true

      - name: Configure Docker for Artifact Registry
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' > gcp-sa-key.json
          gcloud auth activate-service-account github-actions@${{ env.PROJECT_ID }}.iam.gserviceaccount.com --key-file=gcp-sa-key.json
          gcloud auth configure-docker asia-east1-docker.pkg.dev
          rm gcp-sa-key.json

      - name: Build and Push Docker image
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          # 創建服務帳戶金鑰文件
          echo "$GCP_SA_KEY" > /tmp/gcp-sa-key.json

          # 構建 Docker 映像
          docker build \
            --build-arg TIPTAP_PRO_TOKEN=${{ env.TIPTAP_PRO_TOKEN }} \
            --build-arg GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-sa-key.json \
            --build-arg GOOGLE_CLOUD_BUCKET_NAME=${{ env.GOOGLE_CLOUD_BUCKET_NAME }} \
            --build-arg EMAIL_SERVER_HOST=${{ env.EMAIL_SERVER_HOST }} \
            --build-arg EMAIL_SERVER_PORT=${{ env.EMAIL_SERVER_PORT }} \
            --build-arg EMAIL_SERVER_USER=${{ env.EMAIL_SERVER_USER }} \
            --build-arg EMAIL_SERVER_PASSWORD=${{ env.EMAIL_SERVER_PASSWORD }} \
            --build-arg EMAIL_FROM=${{ env.EMAIL_FROM }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY }}/huashui-ai:${{ github.sha }} \
            .
            
          # 清理服務帳戶金鑰文件
          rm /tmp/gcp-sa-key.json
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY }}/huashui-ai:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy huashui-ai \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY }}/huashui-ai:${{ github.sha }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --port 8080 \
            --allow-unauthenticated \
            --service-account github-actions@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --update-secrets="DATABASE_URL=DATABASE_URL:latest,NEXT_PUBLIC_IMAGE_PROCESSOR_URL=NEXT_PUBLIC_IMAGE_PROCESSOR_URL:latest,my-secret=my-secret:latest" \
            --set-env-vars="NEXTAUTH_URL=${{ env.NEXTAUTH_URL }},NEXTAUTH_SECRET=${{ env.NEXTAUTH_SECRET }},GITHUB_ID=${{ env.GITHUB_ID }},GITHUB_SECRET=${{ env.GITHUB_SECRET }}"
          echo "Service URL: $(gcloud run services describe huashui-ai --region ${{ env.REGION }} --format 'value(status.url)')"
