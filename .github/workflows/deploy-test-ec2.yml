name: deloy test ec2
on:
  push:
    branches:
      - test-deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: create key file
        run: |
          echo "${{secrets.EC2_PEM}}" > key.pem
          chmod 400 key.pem
      - name: deploy
        run: |
          ssh -i key.pem ubuntu@${{secrets.EC2_IP}} "
            cd ~/huashui-ai/huashuiai-web/
            git checkout test-deploy
            git checkout .
            git pull origin test-deploy
            docker rm $(docker stop $(docker ps -a -q --filter ancestor=huashuiai-web-docker))
            docker build -t huashuiai-web-docker .
            docker run -d -p 3000:3000 -e NEXT_PUBLIC_IMAGE_PROCESSOR_URL=${{ secrets.NEXT_PUBLIC_IMAGE_PROCESSOR_URL }} huashuiai-web-docker
          "
      - name: del key file
        run: rm -rf key.pem
      - name: success
        run: echo "deploy success"
  
    deploy-image-processor:
    runs-on: ubuntu-latest
    needs: deploy  # 確保在主應用部署後執行
    steps:
      - uses: actions/checkout@v2
      
      - name: Set up Cloud SDK
        uses: google-github/setup-gcloud@v0
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          
      - name: Build and Deploy Image Processor
        run: |
          cd image-processor
          gcloud builds submit --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/image-processor
          gcloud run deploy image-processor \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/image-processor \
            --platform managed \
            --region asia-east1 \
            --set-env-vars GOOGLE_CLOUD_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }},GOOGLE_CLOUD_BUCKET_NAME=${{ secrets.GOOGLE_CLOUD_BUCKET_NAME }} \
            --allow-unauthenticated