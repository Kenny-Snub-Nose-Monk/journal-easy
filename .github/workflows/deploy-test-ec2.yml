name: deploy test ec2

on:
  push:
    branches:
      - test-deploy

jobs:
  Deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Build & Deploy
        env:
          PRIVATE_KEY: ${{ secrets.EC2_PEM }}
          HOSTNAME: ${{secrets.EC2_IP}}
          USER_NAME: ${{secrets.EC2_USER}}

        run: |
          echo "$PRIVATE_KEY" > private_key && chmod 600 private_key
          ssh -o StrictHostKeyChecking=no -i private_key ${USER_NAME}@${HOSTNAME} '
            # Now we have got the access of EC2 and we will start the deploy .
            cd ~/huashui-ai/huashuiai-web/ ;
            echo '------ cd done ------' ;
            git checkout test-deploy ;
            git checkout . ;
            git pull origin test-deploy ;
            echo '------ git pull done ------' ;
            docker rm $(docker stop $(docker ps -a -q --filter ancestor=huashuiai-web-docker)) ;
            echo '------ docker rm done ------' ;
            docker build -t huashuiai-web-docker . ;
            echo '------ docker build done ------'
            docker run -d -p 3000:3000 huashuiai-web-docker ;
            echo '------ docker run done ------' ;
            '
          rm -rf private_key
